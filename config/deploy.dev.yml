# Dev environment — deployed by GitHub Actions on push to `deploy-dev`
# (.github/workflows/deploy.yml). Shared config (image, registry, ssh user,
# volumes, env) comes from config/deploy.yml.
#
# The image is built natively on the amd64 GitHub runner and pushed to GHCR
# with the repo's GITHUB_TOKEN — no cross-build/QEMU and no personal PAT.

servers:
  web:
    # External IP of the dev GCP e2-micro VM (see docs/deployment.md)
    - 35.253.219.26

# No domain in dev: serve plain HTTP on the VM. Real-HTTPS testing (force_ssl,
# LIFF endpoint) goes through a Cloudflare Quick Tunnel on the VM:
#   cloudflared tunnel --url http://localhost:80
proxy:
  ssl: false
