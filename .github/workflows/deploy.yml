# Deploys to the production GCP VM with Kamal (-d production).
# Currently MANUAL-ONLY: production isn't provisioned yet, so the auto
# trigger is disabled. TODO: when the prod VM + domain are configured in
# config/deploy.production.yml, re-enable the workflow_run trigger below
# so every green CI run on main auto-deploys.
name: Deploy

on:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # TODO when re-enabling workflow_run, also restore:
    #   if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    #   and checkout with ref: ${{ github.event.workflow_run.head_sha }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the deploy host on first connection
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: bin/kamal deploy -d production
