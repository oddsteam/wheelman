# Builds the image on the runner (native amd64), pushes to GHCR with the
# repo's GITHUB_TOKEN, and deploys to the dev VM with Kamal.
#
# Uses `kamal setup` (idempotent) so a fresh VM gets kamal-proxy booted on the
# first run; subsequent pushes just redeploy.
#
# TODO (production): add a `main` trigger + a `-d production` job once the prod
# VM + domain are configured in config/deploy.production.yml.
name: Deploy dev

on:
  push:
    branches: [deploy-dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the deploy host on first connection
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: Deploy to dev with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          # Defensive cleanup: strip stray characters a copy-paste may have
          # added to the secrets (the master key must be exactly 32 hex chars).
          export RAILS_MASTER_KEY="$(printf '%s' "$RAILS_MASTER_KEY" | tr -cd '0-9a-f')"
          export LINE_CHANNEL_SECRET="$(printf '%s' "$LINE_CHANNEL_SECRET" | tr -d '[:space:]')"
          if [ "${#RAILS_MASTER_KEY}" -ne 32 ]; then
            echo "::error::RAILS_MASTER_KEY is ${#RAILS_MASTER_KEY} hex chars after cleanup (expected 32)"
            exit 1
          fi
          bin/kamal setup -d dev
